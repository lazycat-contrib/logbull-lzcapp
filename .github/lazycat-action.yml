version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.logbull.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: logbull

build:
  toolchains: []
  run_buildscript: false

images:
  - id: logbull
    target: service
    service: logbull
    source: docker.io/logbull/logbull
    channel: stable
    sort: semver
    tag_regex: '^v?0\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Log Bull
    summary: Published from GitHub Actions
